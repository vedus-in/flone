# Runs this repository's own checks, whatever `check:all` currently chains.
#
# When this workflow was added there were ten of them -- `typecheck`, `build`
# and eight `check:*` scripts -- and nothing ran any of them. Railway builds on
# deploy, so a broken build was caught AFTER merge, and the check scripts (which
# encode the invariants that "rot silently", in their own words) ran only when
# somebody remembered. The `checks` step below is `check:all`, so a script added
# to that chain is picked up here without touching this file.
#
# No secrets. The `web` job does stand up a throwaway Postgres, for the reason
# given on the service below. `mcp:smoke` and `smoke:attachments` are absent:
# both are end-to-end checks against a RUNNING server with a real token, so they
# stay manual rather than turning CI red on a missing secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is all any step here needs.
permissions:
  contents: read

# A second push to a PR makes the first run irrelevant, so PRs cancel. A merged
# commit is the one place the answer has to be recorded, so main does not.
#
# This narrows the window rather than closing it: GitHub keeps at most one
# PENDING run per group regardless, so a burst of merges can still drop a middle
# one while it waits. Fixing that properly means a merge queue, which is a
# bigger change than this repository currently needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web (typecheck, checks, build)
    runs-on: ubuntu-latest

    # Everything here passes without a database EXCEPT six assertions:
    # `check:email` skips its token single-use checks when no database is
    # reachable and reports 22 instead of 28. Those six prove a one-time email
    # token cannot be spent twice, which is not a check worth having only on the
    # machines that happen to have Postgres running. A throwaway service
    # container is cheaper than the gap.
    #
    # Off CI that skip exits 0, so a laptop without Postgres still runs the other
    # 22. Here the same skip exits 1 -- `check-email.ts` treats `CI` as "a skipped
    # check is a failed one" -- so if this service, the URL below or the migrate
    # step breaks, the job goes red instead of quietly proving six fewer things.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flone_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flone_ci

    steps:
      - uses: actions/checkout@v4

      # Both runtimes are needed, not one: `check:boundary` and `check:model`
      # run on plain `node` (the latter relies on Node's type stripping, hence
      # 22.x and not 20), while the other six and the build run on bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      # The schema the six token checks above need. `migrate deploy` rather than
      # `db push`, so CI runs the same migrations production does and a broken
      # migration fails here instead of on deploy.
      - name: migrate
        run: bun run db:deploy

      - name: checks
        run: bun run check:all

      # Last, because it is the slowest and the one most likely to be fixed by
      # whatever the steps above caught. `prisma generate` is part of the script.
      - name: build
        run: bun run build

  cli:
    name: cli (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm, not bun: `cli/` is published to npm with its own lockfile, and its
      # own `tsconfig` is what it is really compiled under. The root typecheck
      # deliberately excludes it, so this job is the only thing checking it.
      - run: npm ci
        working-directory: cli

      - name: build
        run: npm run build
        working-directory: cli

      - name: test
        run: npm test
        working-directory: cli

  # The image self-hosters build with `docker compose up`. Built, not pushed:
  # this only proves the Dockerfile still produces an image.
  docker:
    name: docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t flone:ci .
